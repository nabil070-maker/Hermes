name: build

on:
  push:
    branches: [dev, master]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: catches dead pinned URLs
  workflow_dispatch:
    inputs:
      smoke_test:
        description: "Run full setup.ps1 on the runner (slow, downloads everything)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Parse with Windows PowerShell 5.1, the version the project targets
      - name: Syntax check (PowerShell 5.1)
        shell: powershell
        run: |
          $errors = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $perr = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$perr)
            foreach ($e in $perr) {
              Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $errors++
            }
          }
          if ($errors) { exit 1 }
          Write-Host "All scripts parsed cleanly."

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path . -Recurse -ExcludeRule PSAvoidUsingWriteHost
          $r | Format-Table RuleName, Severity, ScriptName, Line -AutoSize
          if ($r | Where-Object Severity -eq 'Error') { exit 1 }

  check-urls:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify pinned download URLs
        shell: pwsh
        run: |
          $urls = Select-String -Path scripts/setup.ps1 -Pattern '^\$\w+Url\s*=\s*"(https[^"]+)"' |
                  ForEach-Object { $_.Matches[0].Groups[1].Value }
          $failed = 0
          foreach ($u in $urls) {
            try {
              Invoke-WebRequest -Uri $u -Method Head -MaximumRedirection 5 -UseBasicParsing | Out-Null
              Write-Host "OK   $u"
            } catch {
              try {
                # some hosts reject HEAD; ask for one byte instead
                Invoke-WebRequest -Uri $u -Headers @{ Range = "bytes=0-0" } -MaximumRedirection 5 -UseBasicParsing | Out-Null
                Write-Host "OK   $u"
              } catch {
                Write-Host "::error::Dead URL: $u"
                $failed++
              }
            }
          }
          if ($failed) { exit 1 }

  smoke-test:
    if: github.event_name == 'workflow_dispatch' && inputs.smoke_test
    needs: [lint, check-urls]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Run full setup
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\setup.ps1

      - name: Verify hermes.exe runs
        shell: powershell
        run: |
          & "hermes-agent\.venv\Scripts\hermes.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }

  package:
    needs: [lint, check-urls]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        shell: pwsh
        run: |
          $name = "Hermes-Portable-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}"
          New-Item -ItemType Directory -Path "dist/Hermes" -Force | Out-Null
          Copy-Item launch.bat, README.md, LICENSE, scripts -Destination dist/Hermes -Recurse
          Compress-Archive -Path dist/Hermes -DestinationPath "dist/$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: hermes-portable
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hermes-portable
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
